name: Diagnose Build

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  JAVA_VERSION: '21'
  JAVA_DISTRIBUTION: 'temurin'
  GRADLE_OPTS: -Dorg.gradle.daemon=false

jobs:
  diagnose:
    name: Diagnose Kotlin/AGP/KSP Versions
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v6
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: true

      - name: Dump version catalog
        run: |
          echo "## Version Catalog" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          grep -E "^(kotlin|ksp|agp|room|hilt|compose)" gradle/libs.versions.toml >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Dump gradle.properties
        run: |
          echo "## gradle.properties" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat gradle.properties >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Dump root build.gradle.kts plugins
        run: |
          echo "## Root build.gradle.kts plugins" >> $GITHUB_STEP_SUMMARY
          echo '```kotlin' >> $GITHUB_STEP_SUMMARY
          cat build.gradle.kts >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Dump app build.gradle.kts plugins section
        run: |
          echo "## App build.gradle.kts plugins" >> $GITHUB_STEP_SUMMARY
          echo '```kotlin' >> $GITHUB_STEP_SUMMARY
          head -10 app/build.gradle.kts >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Resolve Kotlin Gradle Plugin version
        run: |
          echo "## Resolved Kotlin Gradle Plugin" >> $GITHUB_STEP_SUMMARY
          ./gradlew :app:dependencies --configuration releaseCompileClasspath 2>/dev/null | grep -i "kotlin-gradle-plugin\|kotlin-compiler\|kotlin-stdlib" | head -30 >> $GITHUB_STEP_SUMMARY || true
          echo "" >> $GITHUB_STEP_SUMMARY

      - name: Resolve KSP version
        run: |
          echo "## Resolved KSP" >> $GITHUB_STEP_SUMMARY
          ./gradlew :app:dependencies --configuration releaseCompileClasspath 2>/dev/null | grep -i "ksp\|symbol-processing" | head -20 >> $GITHUB_STEP_SUMMARY || true
          echo "" >> $GITHUB_STEP_SUMMARY

      - name: Resolve Room version
        run: |
          echo "## Resolved Room" >> $GITHUB_STEP_SUMMARY
          ./gradlew :app:dependencies --configuration releaseCompileClasspath 2>/dev/null | grep -i "room3" | head -20 >> $GITHUB_STEP_SUMMARY || true
          echo "" >> $GITHUB_STEP_SUMMARY

      - name: Check AGP bundled Kotlin version
        run: |
          echo "## AGP Bundled Kotlin" >> $GITHUB_STEP_SUMMARY
          find ~/.gradle/caches -name "kotlin-gradle-plugin-*.jar" 2>/dev/null | head -5 >> $GITHUB_STEP_SUMMARY || true
          echo "" >> $GITHUB_STEP_SUMMARY
          find ~/.gradle/caches -name "kotlin-stdlib-*.jar" 2>/dev/null | head -10 >> $GITHUB_STEP_SUMMARY || true
          echo "" >> $GITHUB_STEP_SUMMARY

      - name: Check kotlin-stdlib versions on classpath
        run: |
          echo "## kotlin-stdlib JARs on classpath" >> $GITHUB_STEP_SUMMARY
          find ~/.gradle/caches -name "kotlin-stdlib-*.jar" -not -name "*sources*" -not -name "*javadoc*" 2>/dev/null | sort | head -20 >> $GITHUB_STEP_SUMMARY || true
          echo "" >> $GITHUB_STEP_SUMMARY

      - name: Run assembleRelease (capture output)
        id: build
        continue-on-error: true
        run: ./gradlew assembleRelease --stacktrace 2>&1 | tee build-output.txt

      - name: Extract KSP errors
        if: always()
        run: |
          echo "## KSP Errors" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          grep -E "^\s*e:.*\[ksp\]|^\s*e:.*MissingType|^\s*e:.*incompatible version|^\s*e:.*metadata" build-output.txt | head -30 >> $GITHUB_STEP_SUMMARY || echo "No KSP errors found" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Extract compiler errors
        if: always()
        run: |
          echo "## Compiler Errors (first 30)" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          grep -E "^\s*e:" build-output.txt | head -30 >> $GITHUB_STEP_SUMMARY || echo "No compiler errors found" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Build result
        if: always()
        run: |
          echo "## Build Result" >> $GITHUB_STEP_SUMMARY
          echo "- **Status**: ${{ steps.build.outcome }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch**: ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
