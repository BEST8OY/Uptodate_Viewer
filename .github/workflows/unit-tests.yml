name: Unit Tests

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'app/src/**'
      - 'gradle/**'
      - 'app/build.gradle.kts'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'app/src/**'
      - 'gradle/**'
      - 'app/build.gradle.kts'
  workflow_dispatch:

permissions:
  contents: read

env:
  JAVA_VERSION: '21'
  JAVA_DISTRIBUTION: 'temurin'
  GRADLE_OPTS: -Dorg.gradle.daemon=false

jobs:
  test:
    name: JVM Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: gradle/actions/wrapper-validation@v6

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v5
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: false
          add-job-summary: on-failure
          cache-cleanup: on-success

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Upload test results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-results-${{ github.sha }}
          path: app/build/reports/tests/testDebugUnitTest/
          retention-days: 14

      - name: Show failed test details
        if: failure()
        run: |
          echo "### Failed Test Details" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          for f in app/build/test-results/testDebugUnitTest/*.xml; do
            if [ -f "$f" ]; then
              echo "<details>" >> $GITHUB_STEP_SUMMARY
              echo "<summary>$(basename $f .xml)</summary>" >> $GITHUB_STEP_SUMMARY
              echo "" >> $GITHUB_STEP_SUMMARY
              echo '```xml' >> $GITHUB_STEP_SUMMARY
              cat "$f" | grep -A10 'failure\|error' | head -50 >> $GITHUB_STEP_SUMMARY
              echo '```' >> $GITHUB_STEP_SUMMARY
              echo "</details>" >> $GITHUB_STEP_SUMMARY
              echo "" >> $GITHUB_STEP_SUMMARY
            fi
          done

      - name: Test Summary
        if: always()
        run: |
          echo "### Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Status**: ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch**: ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit**: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
