version: 2

updates:
  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    rebase-strategy: "auto"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps"
    labels:
      - "dependencies"
    groups:
      kotlin:
        patterns:
          - "org.jetbrains.kotlin*"
          - "org.jetbrains.kotlinx:*"
      compose:
        patterns:
          - "androidx.compose*"
      androidx:
        patterns:
          - "androidx.*"
        exclude-patterns:
          - "androidx.compose*"
          - "androidx.navigation*"
          - "androidx.hilt*"
          - "androidx.datastore*"
          - "androidx.lifecycle*"
      navigation:
        patterns:
          - "androidx.navigation3*"
      lifecycle:
        patterns:
          - "androidx.lifecycle*"
      datastore:
        patterns:
          - "androidx.datastore*"
      hilt:
        patterns:
          - "com.google.dagger*"
          - "androidx.hilt*"
      serialization:
        patterns:
          - "org.jetbrains.kotlinx:kotlinx-serialization*"
      webkit:
        patterns:
          - "androidx.webkit*"
      zstd:
        patterns:
          - "org.meshtastic:kzstd"
      agp:
        patterns:
          - "com.android.application"
      ksp:
        patterns:
          - "com.google.devtools.ksp*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    rebase-strategy: "auto"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "ci"
    labels:
      - "dependencies"
    groups:
      checkout:
        patterns:
          - "actions/checkout*"
      java:
        patterns:
          - "actions/setup-java*"
      gradle:
        patterns:
          - "gradle/*"
      upload:
        patterns:
          - "actions/upload-artifact*"
