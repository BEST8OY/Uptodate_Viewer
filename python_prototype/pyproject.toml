[project]
name = "clinref"
version = "0.1.0"
description = "ClinRef clinical retrieval agent — Python prototype"
requires-python = ">=3.13"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "html2text>=2025.4.15",
    "pydantic>=2.13.4",
    "pytest>=9.1.1",
    "python-dotenv>=1.2.2",
    "zstandard>=0.25.0",
]

[project.optional-dependencies]
agent = [
    "chainlit>=2.11.1",
    "langchain-anthropic>=1.5.0",
    "langchain-core>=1.5.0",
    "langchain-mistralai>=1.1.6",
    "langchain-openai>=1.4.0",
    "langgraph>=1.2.9",
    "litellm>=1.93.0",
]
