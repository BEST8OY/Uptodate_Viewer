# Gradle Daemon memory & JVM options (G1GC + Metaspace tuning for R8 & Room/Hilt processing)
org.gradle.jvmargs=-Xmx4g -XX:+UseG1GC -XX:+ParallelRefProcEnabled -XX:MaxMetaspaceSize=1g -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8

# Parallel execution, build cache, and configuration cache for faster builds
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# AndroidX and R-class optimization
android.useAndroidX=true
android.nonTransitiveRClass=true

# Kotlin & KMP Daemon Settings
kotlin.code.style=official
kotlin.incremental=true
kotlin.native.ignoreDisabledTargets=true
kotlin.daemon.jvm.options=-Xmx1024m


